[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isurvive"
version = "0.1.0"
description = "Open field-kit + local-compute stack. Survival knowledge adapted to your situation."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "the-Arow-H" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "stripe>=12.0.0",
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
isurvive = "isurvive.cli:main"

[tool.setuptools.packages.find]
include = ["isurvive*"]

[tool.setuptools.package-data]
isurvive = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
